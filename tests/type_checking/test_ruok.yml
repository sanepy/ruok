- case: catch_bare_sync_preserves_signature
  main: |
    from ruok import catch
    @catch
    def f(x: int) -> str:
        return ""
    reveal_type(f) # N: Revealed type is "def (x: int) -> ruok.ruok.Ok[str] | ruok.ruok.Err[Exception]"

